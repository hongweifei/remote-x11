[package]
name = "rx11-client"
version.workspace = true
edition.workspace = true

[dependencies]
rx11-core = { path = "../rx11-core" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
# The X11 wire protocol, for the focus monitor: it asks the local X server
# which window holds the input focus, and reads the setup reply's resource
# range. The library does the framing; no X11 byte is parsed by hand here.
x11rb-protocol = "0.14"

[dev-dependencies]
# The full X11 client library, for the focus end-to-end test: it creates
# a real window on a real connection and asks the server about the
# focus. The protocol library above only parses and serializes; this one
# also opens a connection and drives the requests.
x11rb = "0.14"
